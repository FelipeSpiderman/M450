spring.application.name=health-leveling
server.port=8080

# Standard: H2 In-Memory-Datenbank (Entwicklung und Tests)
spring.datasource.url=jdbc:h2:mem:healthleveling;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actuator: nur Health-Endpunkt freigeben
management.endpoints.web.exposure.include=health

# Erlaubte Origin fuer das Angular-Frontend
app.cors.allowed-origins=http://localhost:4200

# Datei-Import
spring.servlet.multipart.max-file-size=5MB

# Google Health API (optional). Ohne Refresh Token ist /api/sync deaktiviert (503).
# Werte nie committen, nur als Umgebungsvariablen setzen.
google.health.client-id=${GOOGLE_CLIENT_ID:}
google.health.client-secret=${GOOGLE_CLIENT_SECRET:}
google.health.refresh-token=${GOOGLE_REFRESH_TOKEN:}
# Automatische Synchronisation (Sekunde Minute Stunde Tag Monat Wochentag), Standard: alle 3 Stunden
google.health.sync-cron=0 0 */3 * * *
