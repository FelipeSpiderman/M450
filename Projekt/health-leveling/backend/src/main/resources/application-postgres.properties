# Aktivieren mit: ./mvnw spring-boot:run -Dspring-boot.run.profiles=postgres
# Datenbank starten mit: docker compose up -d (im Ordner health-leveling)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/healthleveling}
spring.datasource.username=${DB_USER:healthleveling}
spring.datasource.password=${DB_PASSWORD:healthleveling}
spring.h2.console.enabled=false
