name: Projekt Health Leveling CI

on:
  push:
    branches: [ "Project" ]
    paths: [ "Projekt/health-leveling/**", ".github/workflows/projekt.yml" ]
  pull_request:
    branches: [ "Project" ]
    paths: [ "Projekt/health-leveling/**", ".github/workflows/projekt.yml" ]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projekt/health-leveling/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Build, Test and Coverage
        run: ./mvnw -B verify

      - name: Upload Test and Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-and-coverage-reports
          path: |
            Projekt/health-leveling/backend/target/site/
            Projekt/health-leveling/backend/target/reports/
            Projekt/health-leveling/backend/target/surefire-reports/
          retention-days: 14

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projekt/health-leveling/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Projekt/health-leveling/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Unit Tests
        run: npx ng test --watch=false

      - name: Build
        run: npx ng build
