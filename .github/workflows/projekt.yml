name: Projekt Health Leveling CI

# Stages: Build -> Test (mit Reports) -> Deploy (nur auf main, nur wenn alle Tests grün sind)
on:
  push:
    branches: [ "main", "Project", "feat/**", "ci/**", "docs/**" ]
    paths: [ "Projekt/health-leveling/**", ".github/workflows/projekt.yml" ]
  pull_request:
    branches: [ "main", "Project" ]
    paths: [ "Projekt/health-leveling/**", ".github/workflows/projekt.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-build:
    name: Build Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projekt/health-leveling/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Compile
        run: ./mvnw -B test-compile

  frontend-build:
    name: Build Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Projekt/health-leveling/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Projekt/health-leveling/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npx ng build

  backend-test:
    name: Test Backend
    needs: backend-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: Projekt/health-leveling/backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x ./mvnw

      - name: Unit and Integration Tests with Coverage
        run: ./mvnw -B verify

      - name: Show Test Results in GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Backend Tests (JUnit)
          path: Projekt/health-leveling/backend/target/surefire-reports/TEST-*.xml
          reporter: java-junit

      - name: Upload Test and Coverage Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-and-coverage-reports
          path: |
            Projekt/health-leveling/backend/target/site/
            Projekt/health-leveling/backend/target/reports/
            Projekt/health-leveling/backend/target/surefire-reports/
          retention-days: 14

  frontend-test:
    name: Test Frontend
    needs: frontend-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    defaults:
      run:
        working-directory: Projekt/health-leveling/frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Projekt/health-leveling/frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Unit Tests (Vitest)
        run: npx ng test --watch=false --reporters=junit --reporters=default --output-file=reports/vitest-junit.xml

      - name: Install Playwright Browser
        run: npx playwright install --with-deps chromium

      - name: E2E Tests (Playwright)
        run: npx playwright test

      - name: Show Test Results in GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Frontend Tests (Vitest and Playwright)
          path: Projekt/health-leveling/frontend/reports/*.xml
          reporter: java-junit

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            Projekt/health-leveling/frontend/reports/
            Projekt/health-leveling/frontend/playwright-report/
          retention-days: 14

  deploy:
    name: Deploy Reports to GitHub Pages
    needs: [ backend-test, frontend-test ]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Download Backend Reports
        uses: actions/download-artifact@v4
        with:
          name: backend-test-and-coverage-reports
          path: backend

      - name: Download Frontend Reports
        uses: actions/download-artifact@v4
        with:
          name: frontend-test-reports
          path: frontend

      - name: Build Report Site
        run: |
          mkdir -p site
          cp -r backend/site/jacoco site/coverage
          cp -r backend/reports site/backend-tests
          cp -r frontend/playwright-report site/e2e
          cp -r frontend/reports site/frontend-junit
          cat > site/index.html <<EOF
          <!doctype html>
          <html lang="de">
          <head><meta charset="utf-8"><title>Health Leveling – Testreports</title></head>
          <body style="font-family: sans-serif; max-width: 40rem; margin: 2rem auto;">
            <h1>Health Leveling – Testreports</h1>
            <p>Stand: Commit ${GITHUB_SHA::7}, Lauf <a href="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}">#${GITHUB_RUN_NUMBER}</a></p>
            <ul>
              <li><a href="backend-tests/surefire.html">Backend: Testreport (Surefire)</a></li>
              <li><a href="coverage/index.html">Backend: Code Coverage (JaCoCo)</a></li>
              <li><a href="e2e/index.html">Frontend: E2E-Tests (Playwright)</a></li>
              <li><a href="frontend-junit/vitest-junit.xml">Frontend: Unit Tests (Vitest, JUnit-XML)</a></li>
            </ul>
          </body>
          </html>
          EOF

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
